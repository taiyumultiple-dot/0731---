<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0620"/>
      <stop offset="60%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bldF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#skyF)"/>
  <!-- folded skyscraper silhouettes, mirrored top/bottom for "inception" feel -->
  <g opacity="0.9">
    <rect x="40" y="380" width="90" height="420" fill="url(#bldF)"/>
    <rect x="150" y="300" width="70" height="500" fill="url(#bldF)"/>
    <rect x="240" y="420" width="110" height="380" fill="url(#bldF)"/>
    <rect x="370" y="340" width="80" height="460" fill="url(#bldF)"/>
    <rect x="470" y="260" width="100" height="540" fill="url(#bldF)"/>
    <rect x="590" y="360" width="90" height="440" fill="url(#bldF)"/>
    <rect x="700" y="300" width="70" height="500" fill="url(#bldF)"/>
    <rect x="790" y="400" width="120" height="400" fill="url(#bldF)"/>
    <rect x="930" y="320" width="80" height="480" fill="url(#bldF)"/>
    <rect x="1030" y="380" width="100" height="420" fill="url(#bldF)"/>
  </g>
  <g opacity="0.5" transform="translate(0,-260) scale(1,-1) translate(0,-800)">
    <rect x="40" y="380" width="90" height="420" fill="url(#bldF)"/>
    <rect x="150" y="300" width="70" height="500" fill="url(#bldF)"/>
    <rect x="240" y="420" width="110" height="380" fill="url(#bldF)"/>
    <rect x="370" y="340" width="80" height="460" fill="url(#bldF)"/>
    <rect x="470" y="260" width="100" height="540" fill="url(#bldF)"/>
    <rect x="590" y="360" width="90" height="440" fill="url(#bldF)"/>
    <rect x="700" y="300" width="70" height="500" fill="url(#bldF)"/>
    <rect x="790" y="400" width="120" height="400" fill="url(#bldF)"/>
    <rect x="930" y="320" width="80" height="480" fill="url(#bldF)"/>
    <rect x="1030" y="380" width="100" height="420" fill="url(#bldF)"/>
  </g>
  <!-- window lights -->
  <g fill="#c4b5fd" opacity="0.5">
    <circle cx="70" cy="450" r="2"/><circle cx="90" cy="500" r="2"/><circle cx="180" cy="380" r="2"/>
    <circle cx="280" cy="480" r="2"/><circle cx="400" cy="420" r="2"/><circle cx="500" cy="340" r="2"/>
    <circle cx="620" cy="440" r="2"/><circle cx="730" cy="380" r="2"/><circle cx="830" cy="470" r="2"/>
    <circle cx="960" cy="400" r="2"/><circle cx="1070" cy="450" r="2"/>
  </g>
  <!-- glow center door light -->
  <ellipse cx="600" cy="600" rx="220" ry="60" fill="#a78bfa" opacity="0.15"/>
  <text x="600" y="760" text-anchor="middle" font-family="serif" font-size="26" fill="#ddd6fe" opacity="0.7">折疊城市 · 待補真圖／美術背景</text>
</svg>
